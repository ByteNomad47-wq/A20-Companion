name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android tools
        run: python3 scripts/bootstrap_android.py --github-env
      - name: Tests, lint and unsigned release
        run: ./gradlew --no-daemon :core:protocol:test :core:device:testDebugUnitTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Check privacy and release packaging
        run: |
          python3 scripts/check_repository.py --apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a20-unsigned-release
          path: |
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/reports/lint-results-release.html
            core/**/build/reports/tests/**
            app/build/reports/tests/**
            build/reports/dependency-verification/**
